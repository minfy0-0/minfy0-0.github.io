<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Seoul cafe market analysis dashboard illustration</title>
  <desc id="desc">Minimal blue dashboard showing a map-like cluster, KPI cards, bar chart, and demand supply gap chart.</desc>
  <rect width="1200" height="800" fill="#eef4f8"/>
  <rect x="70" y="70" width="1060" height="660" rx="32" fill="#ffffff" stroke="#dbe7f0" stroke-width="3"/>
