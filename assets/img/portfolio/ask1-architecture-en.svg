<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><title>ASK1 · Collection and query architecture</title><desc>API responses are preserved as JSONL and Snowflake RAW, then queried through STAGING and MART views in Streamlit.</desc><rect width="1200" height="700" fill="#f4f6f8"/><g font-family="Segoe UI,Malgun Gothic,sans-serif" fill="#172c43"><text x="60" y="72" font-size="30" font-weight="700">ASK1 · Collection and query architecture</text><text x="60" y="110" font-size="21">Source records, query rules, and validation results kept separate</text><rect x="60" y="160" width="320" height="210" rx="10" fill="white" stroke="#cbd5df"/><text x="84" y="204" font-size="25">Public APIs</text><text x="84" y="247" font-size="22">ChEMBL</text><text x="84" y="282" font-size="22">Open Targets</text><text x="84" y="317" font-size="22">ClinicalTrials.gov</text><rect x="440" y="160" width="320" height="210" rx="10" fill="white" stroke="#cbd5df"/><text x="464" y="204" font-size="25">Source preservation</text><text x="464" y="247" font-size="22">JSONL</text><text x="464" y="282" font-size="22">Snowflake RAW</text><text x="464" y="317" font-size="22">5 tables · 4,465 records</text><rect x="820" y="160" width="320" height="210" rx="10" fill="white" stroke="#cbd5df"/><text x="844" y="204" font-size="25">Transform and match</text><text x="844" y="247" font-size="22">STAGING · 6 views</text><text x="844" y="282" font-size="22">MART · 3 views</text><text x="844" y="317" font-size="22">Views over source records</text><text x="394" y="272" font-size="32">→</text><text x="774" y="272" font-size="32">→</text><rect x="60" y="420" width="520" height="174" rx="10" fill="white" stroke="#cbd5df"/><text x="84" y="463" font-size="25">MONITORING</text><text x="84" y="502" font-size="22">Run history · Changes · Quality checks</text><text x="84" y="540" font-size="22">PDF candidates · Review status</text><rect x="620" y="420" width="520" height="174" rx="10" fill="white" stroke="#cbd5df"/><text x="644" y="463" font-size="25">Streamlit · Snapshot viewer</text><text x="644" y="502" font-size="22">ASK1 activities / Selonsertib matches</text><text x="644" y="540" font-size="22">Target associations / Data quality</text><path d="M980 370V412M600 370V393H320V412" fill="none" stroke="#244a70" stroke-width="2"/><text x="60" y="648" font-size="19">Snowflake Warehouse: SQL compute · Collected 2026-09-07–08 / Validated 2026-09-11</text></g></svg>