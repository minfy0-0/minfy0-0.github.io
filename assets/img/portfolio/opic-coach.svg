<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OPIc AI Speaking Practice product overview</title>
  <desc id="desc">A browser interface showing topic practice, survey-based mock exam, transcript and 100-point Korean feedback.</desc>
