  <g font-family="Inter,Arial,sans-serif">
    <text x="771" y="468" font-size="11" fill="#667085">QUESTION RELEVANCE</text><text x="1068" y="468" text-anchor="end" font-size="14" font-weight="700" fill="#101828">88</text>
