<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><title>SEL 약어 · 공식 문서 근거와 검토 상태</title><desc>두 시험의 공식 PDF 인용문은 대조를 통과했지만 의미 검토는 PENDING이며 최종 매핑은 반영하지 않았습니다.</desc><rect width="1200" height="700" fill="#f4f6f8"/><g font-family="Segoe UI,Malgun Gothic,sans-serif" fill="#172c43"><text x="60" y="72" font-size="30" font-weight="700">SEL 약어 · 공식 문서 근거와 검토 상태</text><text x="60" y="112" font-size="21">저장된 검토 기록 요약 · 원본 PDF는 본문의 출처 링크에서 확인</text><rect x="60" y="160" width="510" height="350" rx="10" fill="white" stroke="#cbd5df"/><text x="86" y="205" font-size="26">NCT03449446</text><text x="86" y="245" font-size="20">공식 연구계획서 · PDF 23쪽</text><text x="86" y="308" font-size="26">Selonsertib (SEL)</text><text x="86" y="371" font-size="21">원문 대조: EVIDENCE_MATCHED</text><text x="86" y="418" font-size="23">의미 검토: PENDING</text><text x="86" y="465" font-size="23">최종 매핑 반영: 아니오</text><rect x="630" y="160" width="510" height="350" rx="10" fill="white" stroke="#cbd5df"/><text x="656" y="205" font-size="26">NCT04026165</text><text x="656" y="245" font-size="20">공식 연구계획서 · PDF 22쪽</text><text x="656" y="308" font-size="26">Selonsertib (SEL; GS-4997)</text><text x="656" y="371" font-size="21">원문 대조: EVIDENCE_MATCHED</text><text x="656" y="418" font-size="23">의미 검토: PENDING</text><text x="656" y="465" font-size="23">최종 매핑 반영: 아니오</text><text x="60" y="571" font-size="24">인용문 · 페이지 · 문서 해시 · 출처 대조</text><text x="60" y="620" font-size="23">원문 일치는 의미 검토 완료나 치료 효과의 검증을 뜻하지 않습니다.</text></g></svg>