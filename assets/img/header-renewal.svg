<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Abstract data analytics background</title>
  <desc id="desc">Light gray background with blue analytical lines, bars, and soft gradient circles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eaf3fb"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#63b3ed" stop-opacity=".9"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".75"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1330" cy="140" r="230" fill="#63b3ed" opacity=".14" filter="url(#blur)"/>
  <circle cx="1450" cy="710" r="280" fill="#2563eb" opacity=".10" filter="url(#blur)"/>
  <g opacity=".25" stroke="#7aa7c7" stroke-width="1">
    <path d="M0 160H1600M0 320H1600M0 480H1600M0 640H1600M0 800H1600"/>
    <path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/>
  </g>
  <g transform="translate(980 250)">
    <rect x="0" y="260" width="42" height="120" rx="8" fill="#9ccdf0"/>
    <rect x="78" y="210" width="42" height="170" rx="8" fill="#80bdec"/>
    <rect x="156" y="145" width="42" height="235" rx="8" fill="#63b3ed"/>
    <rect x="234" y="185" width="42" height="195" rx="8" fill="#4b9fe1"/>
    <rect x="312" y="95" width="42" height="285" rx="8" fill="#3182ce"/>
    <polyline points="0,260 99,205 177,170 255,185 333,110 420,70" fill="none" stroke="url(#blue)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff" stroke="#3182ce" stroke-width="6">
      <circle cx="0" cy="260" r="10"/><circle cx="99" cy="205" r="10"/><circle cx="177" cy="170" r="10"/><circle cx="255" cy="185" r="10"/><circle cx="333" cy="110" r="10"/><circle cx="420" cy="70" r="10"/>
    </g>
  </g>
  <g opacity=".45" fill="none" stroke="#63b3ed" stroke-width="3">
    <circle cx="1230" cy="170" r="54"/>
    <circle cx="1230" cy="170" r="88" opacity=".5"/>
    <path d="M1176 170h108M1230 116v108"/>
  </g>
</svg>
