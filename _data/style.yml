# Color Customization
highlight: "#63B3ED"
white: "#F7F9FC"
black: "#111827"

# Image Customization
header-image: "../img/header-renewal.svg"
portfolio-icon: fas fa-arrow-up-right-from-square fa-2x

# Add custom fonts
fonts_urls:
  - "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700&display=swap"

# Set custom fonts
fonts:
  - name: "Inter"
    for: "heading"
  - name: "Inter"
    for: "script"
  - name: "Noto Sans KR"
    for: "serif"
  - name: "Noto Sans KR"
    for: "body"
