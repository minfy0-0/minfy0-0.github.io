  about:
    title: "About Me"
    text: "데이터를 정리하는 사람보다, 데이터로 판단을 돕는 사람이 되고 싶습니다."
    body: >
      생명공학을 주전공으로, 경영학을 복수전공하고 컴퓨터과학을 부전공하며 데이터와 산업 맥락을 함께 이해하는 기반을 쌓았습니다.
      Power BI 기반 시장·입지 분석에서는 여러 원천 데이터를 연결해 KPI와 경쟁 구조를 해석했고, AI 피부 분석 프로젝트에서는 데이터 품질과 모델 성능 지표를 바탕으로 문제를 진단하고 개선 방향을 도출했습니다.
      숫자와 모델 자체보다 분석 결과가 실제 비즈니스 의사결정에 어떻게 쓰이는지에 집중합니다.
